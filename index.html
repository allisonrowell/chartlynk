<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChartLab — Learn to Read Charts</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E17; --panel:#121826; --panel2:#1A2235; --line:rgba(255,255,255,.07);
  --text:#E8ECF5; --sub:#8B95A8; --dim:#5A6478;
  --accent:#5B8DEF; --accent2:#4A7BD8;
  --green:#26A69A; --greenL:#4DD0C4; --red:#EF5350; --redL:#FF7B78;
  --gold:#F5B82E; --purple:#9B7BF0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;font-size:15px;line-height:1.5;
}
#app{min-height:100vh;display:flex;flex-direction:column}

/* ── Top bar ── */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;background:rgba(10,14,23,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem;letter-spacing:-.3px;cursor:pointer}
.brand .logo{
  width:28px;height:28px;border-radius:7px;
  background:linear-gradient(135deg,var(--green),var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.brand .x{color:var(--accent)}
.top-right{display:flex;align-items:center;gap:14px}
.streak{display:flex;align-items:center;gap:5px;font-size:.85rem;font-weight:700;color:var(--gold)}
.xp-pill{
  display:flex;align-items:center;gap:5px;font-size:.82rem;font-weight:700;
  color:var(--accent);background:rgba(91,141,239,.12);
  border:1px solid rgba(91,141,239,.25);border-radius:8px;padding:4px 10px;
}

/* ── Layout ── */
.wrap{max-width:920px;width:100%;margin:0 auto;padding:22px 18px 60px}

/* ── Hero ── */
.hero{text-align:center;padding:30px 0 18px}
.hero .kicker{font-size:.72rem;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:2.3rem;font-weight:900;letter-spacing:-1px;margin:10px 0 6px;line-height:1.1}
.hero p{color:var(--sub);font-size:1.05rem;max-width:520px;margin:0 auto}
.hero .cta{margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ── Buttons ── */
.btn{
  font-family:'Inter',sans-serif;font-weight:700;font-size:.95rem;
  border:none;border-radius:11px;padding:13px 22px;cursor:pointer;
  transition:transform .12s,box-shadow .12s,background .12s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(91,141,239,.3)}
.btn-primary:hover{background:var(--accent2)}
.btn-green{background:var(--green);color:#04201D;box-shadow:0 6px 20px rgba(38,166,154,.25)}
.btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{background:#222c42}
.btn-sm{padding:8px 14px;font-size:.85rem;border-radius:9px}
.btn-block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ── Section label ── */
.sec-label{font-size:.72rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:28px 0 12px}

/* ── Curriculum cards ── */
.track-grid{display:grid;grid-template-columns:1fr;gap:12px}
.track-card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;
  transition:border-color .15s,transform .15s,background .15s;
}
.track-card:hover{border-color:rgba(91,141,239,.4);transform:translateX(3px);background:var(--panel2)}
.track-card.locked{opacity:.5;cursor:not-allowed}
.track-card.locked:hover{transform:none;border-color:var(--line);background:var(--panel)}
.track-num{
  width:42px;height:42px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;font-weight:900;
}
.track-info{flex:1;min-width:0}
.track-name{font-weight:800;font-size:1.02rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.track-desc{color:var(--sub);font-size:.85rem;margin-top:2px}
.track-meta{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--dim);margin-top:6px}
.pill{font-size:.66rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.pill-done{background:rgba(38,166,154,.15);color:var(--greenL)}
.pill-prog{background:rgba(245,184,46,.15);color:var(--gold)}
.pill-new{background:rgba(91,141,239,.15);color:var(--accent)}
.pill-soon{background:rgba(255,255,255,.06);color:var(--dim)}
.track-arrow{color:var(--dim);font-size:1.3rem}

/* progress bar inside card */
.mini-prog{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:8px}
.mini-prog>div{height:100%;background:linear-gradient(90deg,var(--green),var(--accent));border-radius:3px;transition:width .4s}

/* ── Stats row ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat .big{font-size:1.6rem;font-weight:900;letter-spacing:-.5px}
.stat .lbl{font-size:.72rem;color:var(--sub);font-weight:600;margin-top:2px}

/* ── Lesson screen ── */
.lesson-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.lesson-top .crumbs{font-size:.82rem;color:var(--sub);font-weight:600}
.lesson-top .crumbs b{color:var(--text)}
.prog-line{height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:6px}
.prog-line>div{height:100%;background:linear-gradient(90deg,var(--green),var(--accent));border-radius:4px;transition:width .4s}
.step-dots{display:flex;gap:5px;margin-bottom:20px;flex-wrap:wrap}
.step-dots .d{flex:1;min-width:14px;height:4px;border-radius:2px;background:rgba(255,255,255,.1)}
.step-dots .d.done{background:var(--green)}
.step-dots .d.cur{background:var(--gold)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h2{font-size:1.4rem;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.card .lead{color:var(--sub);font-size:.95rem;margin-bottom:18px}
.card p{color:var(--text);margin-bottom:14px;font-size:.96rem}
.card p.muted{color:var(--sub)}

.concept{
  background:var(--panel2);border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;padding:14px 16px;margin:16px 0;font-size:.92rem;
}
.concept .ct{font-size:.7rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.concept.warn{border-left-color:var(--gold)}
.concept.warn .ct{color:var(--gold)}

.term-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.term{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:.82rem}
.term b{color:var(--accent)}

.chart-cap{font-size:.8rem;color:var(--dim);text-align:center;margin-top:8px;font-style:italic}

.nav-row{display:flex;gap:10px;margin-top:22px}

/* ── Quiz ── */
.quiz-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.quiz-q{font-size:1.1rem;font-weight:700;margin-bottom:16px}
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.opt{
  background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;
  padding:14px 16px;cursor:pointer;font-size:.92rem;font-weight:600;
  transition:border-color .12s,background .12s;display:flex;gap:10px;align-items:center;
}
.opt:hover:not(.dis){border-color:rgba(91,141,239,.5);background:#222c42}
.opt .key{
  width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78rem;flex-shrink:0;
}
.opt.correct{border-color:var(--green);background:rgba(38,166,154,.12)}
.opt.correct .key{background:var(--green);color:#04201D}
.opt.wrong{border-color:var(--red);background:rgba(239,83,80,.1)}
.opt.wrong .key{background:var(--red);color:#fff}
.opt.dis{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-radius:11px;font-size:.9rem;line-height:1.55}
.explain.ok{background:rgba(38,166,154,.1);border:1px solid rgba(38,166,154,.3);color:var(--greenL)}
.explain.no{background:rgba(239,83,80,.1);border:1px solid rgba(239,83,80,.3);color:var(--redL)}

/* ── Practice (interactive charting) ── */
.practice-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.practice-head h2{font-size:1.3rem;font-weight:800}
.tool-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tool{
  background:var(--panel2);border:1.5px solid var(--line);border-radius:9px;
  padding:8px 13px;cursor:pointer;font-size:.82rem;font-weight:700;
  display:flex;align-items:center;gap:6px;transition:all .12s;color:var(--sub);
}
.tool:hover{border-color:rgba(255,255,255,.2);color:var(--text)}
.tool.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tool .dot{width:10px;height:10px;border-radius:50%}
.chart-shell{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;position:relative}
#chart{width:100%;display:block;border-radius:8px;cursor:crosshair;touch-action:none}
.chart-hint{font-size:.8rem;color:var(--dim);margin-top:10px;display:flex;align-items:center;gap:6px}
.practice-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.task-card{
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:14px;
}
.task-card .tlabel{font-size:.7rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
.task-card .ttext{font-size:.95rem;font-weight:600}
.feedback-banner{
  border-radius:11px;padding:13px 16px;margin-top:14px;font-size:.92rem;font-weight:600;
  display:none;animation:slideDown .3s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.feedback-banner.show{display:block}
.feedback-banner.ok{background:rgba(38,166,154,.12);border:1px solid rgba(38,166,154,.35);color:var(--greenL)}
.feedback-banner.no{background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.35);color:var(--redL)}

/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--sub);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* complete */
.complete{text-align:center;padding:40px 0}
.complete .check{
  width:80px;height:80px;border-radius:50%;margin:0 auto 18px;
  background:rgba(38,166,154,.15);border:2px solid var(--green);
  display:flex;align-items:center;justify-content:center;font-size:2.5rem;
}
.complete h2{font-size:1.8rem;font-weight:900;margin-bottom:8px}
.complete p{color:var(--sub);margin-bottom:6px}
.reward{display:inline-flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 18px;margin:14px 0;font-weight:700;color:var(--gold)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:999}

.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:560px){
  .hero h1{font-size:1.9rem}
  .wrap{padding:18px 14px 50px}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="app"></div>

<script>
"use strict";

/* ════════════════════════════════════════════════════
   CANDLE DATA GENERATION
   Deterministic seeded generator so charts are stable.
════════════════════════════════════════════════════ */
function mulberry32(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
// Generate candles with a chosen "shape": uptrend, downtrend, range, hh-hl, etc.
function genCandles(seed, n, opts={}){
  const r=mulberry32(seed);
  const drift=opts.drift||0;            // per-candle bias
  const vol=opts.vol||1.2;              // volatility
  let price=opts.start||100;
  const out=[];
  for(let i=0;i<n;i++){
    const open=price;
    let move=(r()-0.5)*2*vol + drift;
    // optional waypoints to force structure
    if(opts.wave){
      move += Math.sin(i/opts.wave.period)*opts.wave.amp;
    }
    const close=Math.max(1, open+move);
    const wickUp=r()*vol*0.9;
    const wickDn=r()*vol*0.9;
    const high=Math.max(open,close)+wickUp;
    const low=Math.min(open,close)-wickDn;
    out.push({open,high,low,close});
    price=close;
  }
  return out;
}
// Build candles passing through explicit pivot points (for structure lessons)
function candlesThroughPivots(pivots, perLeg, seed){
  const r=mulberry32(seed);
  const out=[];
  for(let p=0;p<pivots.length-1;p++){
    const a=pivots[p], b=pivots[p+1];
    for(let i=0;i<perLeg;i++){
      const t=i/perLeg, t2=(i+1)/perLeg;
      const base=a+(b-a)*t;
      const nextBase=a+(b-a)*t2;
      const open=base+(r()-0.5)*1.0;
      const close=nextBase+(r()-0.5)*1.0;
      const high=Math.max(open,close)+r()*1.4;
      const low=Math.min(open,close)-r()*1.4;
      out.push({open,high,low,close});
    }
  }
  return out;
}

/* ════════════════════════════════════════════════════
   CHART RENDERER (canvas, candlesticks)
════════════════════════════════════════════════════ */
class Chart{
  constructor(canvas, candles, cfg={}){
    this.cv=canvas; this.ctx=canvas.getContext('2d');
    this.candles=candles;
    this.cfg=Object.assign({padL:8,padR:54,padT:14,padB:24,grid:true},cfg);
    this.overlays=cfg.overlays||[];    // static drawn objects {type,...}
    this.userLines=[];                 // user-drawn horizontal/trend lines
    this.userMarks=[];                 // user-placed point markers {x,y,label,color}
    this.dpr=window.devicePixelRatio||1;
    this._resize();
    this._computeScale();
  }
  _resize(){
    const rect=this.cv.getBoundingClientRect();
    this.w=rect.width||640; this.h=this.cfg.height||340;
    this.cv.width=this.w*this.dpr; this.cv.height=this.h*this.dpr;
    this.cv.style.height=this.h+'px';
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
  }
  _computeScale(){
    let min=Infinity,max=-Infinity;
    for(const c of this.candles){ if(c.low<min)min=c.low; if(c.high>max)max=c.high; }
    const pad=(max-min)*0.08;
    this.min=min-pad; this.max=max+pad;
    this.plotL=this.cfg.padL; this.plotR=this.w-this.cfg.padR;
    this.plotT=this.cfg.padT; this.plotB=this.h-this.cfg.padB;
    this.plotW=this.plotR-this.plotL; this.plotH=this.plotB-this.plotT;
    this.cw=this.plotW/this.candles.length;     // candle slot width
  }
  xOf(i){ return this.plotL + i*this.cw + this.cw/2; }
  yOf(p){ return this.plotB - (p-this.min)/(this.max-this.min)*this.plotH; }
  priceAt(y){ return this.min + (this.plotB-y)/this.plotH*(this.max-this.min); }
  indexAt(x){ return Math.floor((x-this.plotL)/this.cw); }

  draw(){
    const c=this.ctx;
    c.clearRect(0,0,this.w,this.h);
    // background
    c.fillStyle='#0E1420'; c.fillRect(0,0,this.w,this.h);
    // grid + price axis
    if(this.cfg.grid){
      c.strokeStyle='rgba(255,255,255,.05)'; c.lineWidth=1;
      c.fillStyle='#5A6478'; c.font='10px Inter'; c.textAlign='left';
      const steps=5;
      for(let i=0;i<=steps;i++){
        const p=this.min+(this.max-this.min)*i/steps;
        const y=this.yOf(p);
        c.beginPath(); c.moveTo(this.plotL,y); c.lineTo(this.plotR,y); c.stroke();
        c.fillText(p.toFixed(1), this.plotR+6, y+3);
      }
    }
    // static overlays (drawn behind candles if zones)
    for(const o of this.overlays){ if(o.type==='zone') this._drawZone(o); }
    // candles
    const bodyW=Math.max(2,Math.min(this.cw*0.62,16));
    for(let i=0;i<this.candles.length;i++){
      const cd=this.candles[i], x=this.xOf(i);
      const up=cd.close>=cd.open;
      const col=up?'#26A69A':'#EF5350';
      c.strokeStyle=col; c.fillStyle=col; c.lineWidth=1.4;
      // wick
      c.beginPath(); c.moveTo(x,this.yOf(cd.high)); c.lineTo(x,this.yOf(cd.low)); c.stroke();
      // body
      const yO=this.yOf(cd.open), yC=this.yOf(cd.close);
      const top=Math.min(yO,yC), bh=Math.max(2,Math.abs(yC-yO));
      c.fillRect(x-bodyW/2, top, bodyW, bh);
    }
    // static line overlays (support/resistance/trend/labels) on top
    for(const o of this.overlays){
      if(o.type==='hline') this._drawHLine(o);
      else if(o.type==='tline') this._drawTLine(o);
      else if(o.type==='label') this._drawLabel(o);
      else if(o.type==='pivot') this._drawPivot(o);
    }
    // user drawings
    for(const l of this.userLines) this._drawUserLine(l);
    for(const m of this.userMarks) this._drawUserMark(m);
  }
  _drawZone(o){
    const c=this.ctx;
    const y1=this.yOf(o.priceHigh), y2=this.yOf(o.priceLow);
    c.fillStyle=o.color||'rgba(91,141,239,.12)';
    c.fillRect(this.plotL,Math.min(y1,y2),this.plotW,Math.abs(y2-y1));
  }
  _drawHLine(o){
    const c=this.ctx, y=this.yOf(o.price);
    c.strokeStyle=o.color||'#5B8DEF'; c.lineWidth=o.width||1.5;
    c.setLineDash(o.dash||[6,4]);
    c.beginPath(); c.moveTo(this.plotL,y); c.lineTo(this.plotR,y); c.stroke();
    c.setLineDash([]);
    if(o.label){
      c.fillStyle=o.color||'#5B8DEF'; c.font='bold 10px Inter'; c.textAlign='left';
      c.fillText(o.label,this.plotL+4,y-5);
    }
  }
  _drawTLine(o){
    const c=this.ctx;
    const x1=this.xOf(o.i1), y1=this.yOf(o.p1), x2=this.xOf(o.i2), y2=this.yOf(o.p2);
    c.strokeStyle=o.color||'#F5B82E'; c.lineWidth=o.width||2;
    c.setLineDash(o.dash||[]);
    c.beginPath(); c.moveTo(x1,y1);
    // extend
    const dx=x2-x1, dy=y2-y1;
    const ext=o.extend? (this.plotR-x2)/(dx||1):0;
    c.lineTo(x2+dx*ext, y2+dy*ext); c.stroke();
    c.setLineDash([]);
    if(o.label){
      c.fillStyle=o.color||'#F5B82E'; c.font='bold 10px Inter'; c.textAlign='left';
      c.fillText(o.label,x2+4,y2-4);
    }
  }
  _drawPivot(o){
    const c=this.ctx, x=this.xOf(o.i), y=this.yOf(o.price);
    const off=o.top? -14:14;
    c.fillStyle=o.color||'#9B7BF0';
    c.beginPath(); c.arc(x,y,3.5,0,7); c.fill();
    c.font='bold 11px Inter'; c.textAlign='center';
    c.fillText(o.label, x, y+off+ (o.top?0:4));
  }
  _drawLabel(o){
    const c=this.ctx;
    c.fillStyle=o.color||'#E8ECF5'; c.font='bold 11px Inter'; c.textAlign=o.align||'center';
    c.fillText(o.text, o.x!=null?o.x:this.xOf(o.i), o.y!=null?o.y:this.yOf(o.price));
  }
  _drawUserLine(l){
    const c=this.ctx;
    c.strokeStyle=l.color; c.lineWidth=2; c.setLineDash(l.type==='h'?[2,3]:[]);
    c.beginPath();
    if(l.type==='h'){ const y=this.yOf(l.price); c.moveTo(this.plotL,y); c.lineTo(this.plotR,y); }
    else { c.moveTo(l.x1,l.y1); c.lineTo(l.x2,l.y2); }
    c.stroke(); c.setLineDash([]);
  }
  _drawUserMark(m){
    const c=this.ctx;
    c.fillStyle=m.color; c.beginPath(); c.arc(m.x,m.y,5,0,7); c.fill();
    c.strokeStyle='#fff'; c.lineWidth=1.5; c.stroke();
    if(m.label){
      c.fillStyle='#fff'; c.font='bold 11px Inter'; c.textAlign='center';
      c.fillText(m.label, m.x, m.y- (m.up?10:-18));
    }
  }
}

const SAVE_KEY='chartlab_v1';
let S=loadState();
function loadState(){
  try{ return JSON.parse(localStorage.getItem(SAVE_KEY))||defaultState(); }
  catch{ return defaultState(); }
}
function defaultState(){
  return {xp:0, streak:1, progress:{}, completed:{}};
  // progress[trackId] = stepIndex reached; completed[trackId]=true
}
function persist(){ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }

let view={screen:'home', track:null, step:0, answered:false, sel:null, activeChart:null, tool:null, practiceDone:false};

/* ════════════════════════════════════════════════════
   RENDER
════════════════════════════════════════════════════ */
const app=()=>document.getElementById('app');
function render(){
  if(view.screen==='home') renderHome();
  else if(view.screen==='step') renderStep();
  else if(view.screen==='complete') renderComplete();
}

function topbar(){
  return `<div class="topbar">
    <div class="brand" onclick="goHome()"><span class="logo">📊</span>Chart<span class="x">Lab</span></div>
    <div class="top-right">
      <div class="streak">🔥 ${S.streak}</div>
      <div class="xp-pill">⚡ ${S.xp} XP</div>
    </div>
  </div>`;
}

function renderHome(){
  const totalSteps=TRACKS.reduce((a,t)=>a+t.steps.length,0);
  const doneSteps=Object.values(S.progress).reduce((a,v)=>a+v,0);
  const tracksDone=Object.keys(S.completed).length;

  const cards=TRACKS.map((t,ti)=>{
    const prog=S.progress[t.id]||0;
    const done=S.completed[t.id];
    const pct=Math.round(prog/t.steps.length*100);
    const unlocked = ti===0 || S.completed[TRACKS[ti-1].id] || prog>0;
    let pill = done?'<span class="pill pill-done">Completed</span>'
              : prog>0?'<span class="pill pill-prog">In progress</span>'
              : unlocked?'<span class="pill pill-new">Start</span>'
              : '<span class="pill pill-soon">Locked</span>';
    return `<div class="track-card ${unlocked?'':'locked'}" ${unlocked?`onclick="openTrack(${ti})"`:''}>
      <div class="track-num" style="background:${t.color}20;color:${t.color}">${t.icon}</div>
      <div class="track-info">
        <div class="track-name">${t.num}. ${t.name} ${pill}</div>
        <div class="track-desc">${t.desc}</div>
        <div class="track-meta">${t.steps.filter(s=>s.type==='lesson').length} lessons · ${t.steps.filter(s=>s.type==='quiz').length} quiz · ${t.steps.filter(s=>s.type==='practice').length} practice</div>
        ${prog>0&&!done?`<div class="mini-prog"><div style="width:${pct}%"></div></div>`:''}
      </div>
      <div class="track-arrow">${done?'✓':'›'}</div>
    </div>`;
  }).join('');

  app().innerHTML=topbar()+`<div class="wrap fade">
    <div class="hero">
      <div class="kicker">Chart Literacy · For Adults</div>
      <h1>Learn to read charts<br>with structure, not stress.</h1>
      <p>A step-by-step path from a single candle to institutional concepts — with real charts you practice on, not just theory.</p>
    </div>
    <div class="stats">
      <div class="stat"><div class="big">${doneSteps}/${totalSteps}</div><div class="lbl">Lessons done</div></div>
      <div class="stat"><div class="big">${tracksDone}/${TRACKS.length}</div><div class="lbl">Tracks complete</div></div>
      <div class="stat"><div class="big">${S.xp}</div><div class="lbl">Total XP</div></div>
    </div>
    <div class="sec-label">Your Curriculum</div>
    <div class="track-grid">${cards}</div>
    <p style="text-align:center;color:var(--dim);font-size:.78rem;margin-top:28px">Educational platform only. Not financial advice.</p>
  </div>`;
}

function renderStep(){
  const t=TRACKS[view.track];
  const step=t.steps[view.step];
  const total=t.steps.length;
  const pct=Math.round((view.step)/total*100);
  const dots=t.steps.map((s,i)=>`<div class="d ${i<view.step?'done':i===view.step?'cur':''}"></div>`).join('');

  let inner='';
  if(step.type==='lesson') inner=lessonHTML(t,step);
  else if(step.type==='quiz') inner=quizHTML(t,step);
  else if(step.type==='practice') inner=practiceHTML(t,step);

  app().innerHTML=topbar()+`<div class="wrap fade">
    <div class="lesson-top">
      <button class="btn btn-ghost btn-sm" onclick="goHome()">← Tracks</button>
      <div class="crumbs"><b>${t.name}</b> · ${view.step+1}/${total}</div>
    </div>
    <div class="prog-line"><div style="width:${pct}%"></div></div>
    <div class="step-dots">${dots}</div>
    ${inner}
  </div>`;

  // mount chart if present
  if(step.chart){
    requestAnimationFrame(()=>{
      const cv=document.getElementById('chart');
      if(cv){ view.activeChart=buildChart(cv,step.chart);
        if(step.type==='practice') wireUpPractice(t,step); }
    });
  }
}

function lessonHTML(t,step){
  const terms=step.terms?`<div class="term-row">${step.terms.map(([a,b])=>`<div class="term"><b>${a}</b> — ${b}</div>`).join('')}</div>`:'';
  const after=step.afterTerms||'';
  const concept=step.concept?`<div class="concept ${step.concept.warn?'warn':''}"><div class="ct">${step.concept.t}</div>${step.concept.body}</div>`:'';
  const chart=step.chart?`<div class="chart-shell"><canvas id="chart"></canvas></div>${step.cap?`<div class="chart-cap">${step.cap}</div>`:''}`:'';
  return `<div class="card">
    <h2>${step.title}</h2>
    <div class="lead">${step.lead||''}</div>
    ${step.body||''}
    ${terms}${after}
    ${chart}
    ${concept}
    <div class="nav-row">
      ${view.step>0?`<button class="btn btn-ghost btn-block" onclick="prevStep()">← Back</button>`:''}
      <button class="btn btn-primary btn-block" onclick="nextStep()">Continue →</button>
    </div>
  </div>`;
}

function quizHTML(t,step){
  const opts=step.opts.map((o,i)=>{
    let cls='';
    if(view.answered){
      if(i===step.answer) cls='correct';
      else if(i===view.sel) cls='wrong';
      cls+=' dis';
    }
    return `<div class="opt ${cls}" ${view.answered?'':`onclick="pickOpt(${i})"`}>
      <span class="key">${String.fromCharCode(65+i)}</span>${o}</div>`;
  }).join('');
  const ok=view.answered&&view.sel===step.answer;
  const explain=view.answered?`<div class="explain ${ok?'ok':'no'}">${ok?'✓ Correct. ':'✗ Not quite. '}${step.exp}</div>`:'';
  return `<div class="quiz-box">
    <div style="font-size:.7rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:10px">Quick Check</div>
    <div class="quiz-q">${step.q}</div>
    <div class="quiz-opts">${opts}</div>
    ${explain}
    ${view.answered?`<div class="nav-row"><button class="btn btn-primary btn-block" onclick="nextStep()">Continue →</button></div>`:''}
  </div>`;
}

    tools=`<div class="tool ${view.tool==='support'?'active':''}" onclick="setTool('support')"><span class="dot" style="background:#26A69A"></span>Support tool</div>`;

    tools=`<div class="tool ${view.tool==='trend'?'active':''}" onclick="setTool('trend')"><span class="dot" style="background:#F5B82E"></span>Trendline tool</div>`;

/* ════════════════════════════════════════════════════
   PRACTICE INTERACTION
════════════════════════════════════════════════════ */
function wireUpPractice(t,step){
  const ch=view.activeChart;
  const cv=document.getElementById('chart');
  if(!cv||!ch) return;
  view.tool = step.tool==='hline'?'support'
            : step.tool==='tline'?'trend'
            : step.tool==='marks'?'HH'
            : step.tool==='icc'?'grab'
            : step.tool==='level'?'level'
            : step.tool==='pointmark'?'point':null;
  view.trendPts=[];
  // re-render toolbar active state
  let dragging=false;

  function pos(e){
    const r=cv.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
    return {x:cx,y:cy};
  }
  function handle(e){
    e.preventDefault();
    const {x,y}=pos(e);
    if(view.tool==='support'){
      ch.userLines=[{type:'h',price:ch.priceAt(y),color:'#26A69A'}];
    } else if(view.tool==='trend'){
      view.trendPts.push({x,y});
      if(view.trendPts.length>2) view.trendPts=[{x,y}];
      if(view.trendPts.length===2){
        ch.userLines=[{type:'t',x1:view.trendPts[0].x,y1:view.trendPts[0].y,x2:view.trendPts[1].x,y2:view.trendPts[1].y,color:'#F5B82E'}];
      } else {
        ch.userMarks=[{x,y,color:'#F5B82E',label:''}];
      }
    } else if(view.tool==='HH'||view.tool==='HL'){
      // remove existing of same label then add
      ch.userMarks=ch.userMarks.filter(m=>m.label!==view.tool);
      ch.userMarks.push({x,y,color:view.tool==='HH'?'#26A69A':'#5B8DEF',label:view.tool,up:view.tool==='HH'});
    } else if(view.tool==='grab'||view.tool==='zone'){
      ch.userMarks=ch.userMarks.filter(m=>m.kind!==view.tool);
      ch.userMarks.push({x,y,color:view.tool==='grab'?'#EF5350':'#9B7BF0',label:view.tool,kind:view.tool,up:view.tool==='grab'});
      if(view.tool==='zone'){ ch.userLines=ch.userLines.filter(l=>l.kind!=='zone'); ch.userLines.push({type:'h',price:ch.priceAt(y),color:'#9B7BF0',kind:'zone'}); }
    } else if(view.tool==='level'){
      ch.userLines=[{type:'h',price:ch.priceAt(y),color:step.toolColor||'#5B8DEF'}];
    } else if(view.tool==='point'){
      ch.userMarks=[{x,y,color:step.toolColor||'#9B7BF0',label:step.toolLabel||'',up:true}];
    }
    ch.draw();
  }
  const drag=()=>view.tool==='support'||view.tool==='level';
  cv.onmousedown=e=>{dragging=true;handle(e);};
  cv.onmousemove=e=>{if(dragging&&drag())handle(e);};
  cv.onmouseup=()=>dragging=false;
  cv.ontouchstart=handle;
  cv.ontouchmove=e=>{if(drag())handle(e);};
}

function setTool(tool){ view.tool=tool;
  // update active classes without full redraw
  document.querySelectorAll('.tool').forEach(el=>el.classList.remove('active'));
  event.currentTarget.classList.add('active');
}
function clearDrawings(){
  const ch=view.activeChart; if(!ch)return;
  ch.userLines=[]; ch.userMarks=[]; view.trendPts=[]; ch.draw();
  const fb=document.getElementById('fb'); if(fb){fb.className='feedback-banner';fb.innerHTML='';}
}

function checkPractice(){
  const t=TRACKS[view.track], step=t.steps[view.step], ch=view.activeChart;
  const fb=document.getElementById('fb');
  let ok=false, msg='';
  const tol=(ch.max-ch.min)*0.06; // price tolerance

  if(step.checkType==='supportLevel'){
    const line=ch.userLines.find(l=>l.type==='h');
    if(!line){ msg='Draw a support line first — select the Support tool and click on the chart.'; }
    else if(Math.abs(line.price-ch.answerPrice)<=tol*1.4){ ok=true; msg='Nailed it. That\'s the level where buyers keep defending — every dip into it bounced.'; }
    else { msg=`Close, but not quite at the support. Look lower — find where the candle lows line up (around ${ch.answerPrice.toFixed(0)}).`; }
  }
  else if(step.checkType==='uptrendLine'){
    const line=ch.userLines.find(l=>l.type==='t');
    if(!line){ msg='Draw a trendline — click the first swing low, then a later swing low.'; }
    else {
      const slopeUp=(line.y2-line.y1)/(line.x2-line.x1) < -0.05; // y inverted: up = negative slope
      if(slopeUp){ ok=true; msg='Good. Your line rises under the swing lows — as long as price holds above it, the uptrend is intact.'; }
      else { msg='Your line should rise to the right (connect a low to a HIGHER later low). Try again.'; }
    }
  }
  else if(step.checkType==='structureLabels'){
    const hh=ch.userMarks.find(m=>m.label==='HH');
    const hl=ch.userMarks.find(m=>m.label==='HL');
    if(!hh||!hl){ msg='Place at least one HH and one HL marker on the chart.'; }
    else {
      const hhOK=ch.answerPivots.some(p=>p.label==='HH'&&Math.abs(ch.xOf(p.i)-hh.x)<ch.cw*3 && hh.y<ch.plotH*0.6+ch.plotT+40);
      const hlOK=ch.answerPivots.some(p=>p.label==='HL'&&Math.abs(ch.xOf(p.i)-hl.x)<ch.cw*3);
      if(hh.y<hl.y){ ok=true; msg='Right structure. The peaks are your higher highs, the valleys your higher lows — textbook uptrend.'; }
      else { msg='Check placement: HH belongs on a peak (higher up), HL on a valley (lower down). Your HH should sit above your HL.'; }
    }
  }
  else if(step.checkType==='iccSetup'){
    const grab=ch.userMarks.find(m=>m.kind==='grab');
    const zone=ch.userMarks.find(m=>m.kind==='zone');
    if(!grab||!zone){ msg='Mark both: the Grab (the sweep wick low) and the Zone (base of the displacement candle).'; }
    else {
      const grabX=ch.xOf(ch.answerGrab.i);
      const grabOK=Math.abs(grab.x-grabX)<ch.cw*3 && ch.priceAt(grab.y)<ch.answerGrab.price+tol*2;
      const zoneOK=zone.x>grabX; // zone after the grab
      if(grabOK&&zoneOK){ ok=true; msg='That\'s the setup: liquidity swept below support (the grab), then displacement up. The zone is your entry on a pullback, stop below the grab.'; }
      else if(!grabOK){ msg='The grab is the lowest wick that pierces support then snaps back — look for the deepest spike.'; }
      else { msg='The zone should come AFTER the grab — it\'s the base of the big candle that displaced upward.'; }
    }
  }
  else if(step.checkType==='levelNear'){
    const line=ch.userLines.find(l=>l.type==='h');
    if(!line){ msg=step.noDrawMsg||'Select the tool, then click on the chart to mark the level.'; }
    else if(Math.abs(line.price-ch.answerPrice)<=tol*1.6){ ok=true; msg=step.okMsg||'Correct!'; }
    else { msg=step.failMsg||'Not quite — look again at where the level sits.'; }
  }
  else if(step.checkType==='levelBelow'){
    const line=ch.userLines.find(l=>l.type==='h');
    const band=(ch.max-ch.min)*0.22;
    if(!line){ msg=step.noDrawMsg||'Place your stop line on the chart.'; }
    else if(line.price<ch.answerPrice && line.price>ch.answerPrice-band){ ok=true; msg=step.okMsg||'Good stop placement.'; }
    else if(line.price>=ch.answerPrice){ msg=step.failMsg||'Your stop is too high — it should sit just BELOW the swing low.'; }
    else { msg='That stop is very far away — tighten it to just below the structure for better risk:reward.'; }
  }
  else if(step.checkType==='markCandle'){
    const m=ch.userMarks[ch.userMarks.length-1];
    if(!m){ msg=step.noDrawMsg||'Click directly on the candle.'; }
    else if(Math.abs(m.x-ch.xOf(ch.answerIndex))<ch.cw*2.2){ ok=true; msg=step.okMsg||'That\'s the one!'; }
    else { msg=step.failMsg||'Not that candle — look again.'; }
  }

  if(fb){ fb.className='feedback-banner show '+(ok?'ok':'no'); fb.innerHTML=(ok?'✓ ':'')+msg; }
  if(ok){
    view.practiceDone=true;
    document.getElementById('checkBtn').style.display='none';
    document.getElementById('contBtn').style.display='inline-flex';
    bumpXP(10);
  }
}

/* ════════════════════════════════════════════════════
   NAV / FLOW
════════════════════════════════════════════════════ */
function goHome(){ view.screen='home'; render(); window.scrollTo(0,0); }
function openTrack(ti){
  view.track=ti;
  view.step=S.progress[TRACKS[ti].id]&&!S.completed[TRACKS[ti].id]?S.progress[TRACKS[ti].id]:0;
  if(S.completed[TRACKS[ti].id]) view.step=0;
  resetStepFlags();
  view.screen='step'; render(); window.scrollTo(0,0);
}
function resetStepFlags(){ view.answered=false; view.sel=null; view.practiceDone=false; view.tool=null; view.trendPts=[]; }
function pickOpt(i){
  const t=TRACKS[view.track], step=t.steps[view.step];
  view.sel=i; view.answered=true;
  if(i===step.answer) bumpXP(10);
  renderStep(); window.scrollTo(0,0);
}
function nextStep(){
  const t=TRACKS[view.track];
  // record progress
  const reached=Math.max(S.progress[t.id]||0, view.step+1);
  S.progress[t.id]=Math.min(reached,t.steps.length); persist();
  if(view.step+1>=t.steps.length){
    if(!S.completed[t.id]){ S.completed[t.id]=true; bumpXP(t.steps.length*15); }
    S.completed[t.id]=true; persist();
    view.screen='complete'; render(); window.scrollTo(0,0); return;
  }
  view.step++; resetStepFlags(); renderStep(); window.scrollTo(0,0);
}
function prevStep(){ if(view.step>0){view.step--;resetStepFlags();renderStep();window.scrollTo(0,0);} }
function bumpXP(n){ S.xp+=n; persist();
  document.querySelectorAll('.xp-pill').forEach(e=>e.innerHTML='⚡ '+S.xp+' XP');
}

/* ════════════════════════════════════════════════════
   CONFETTI
════════════════════════════════════════════════════ */
const conf=document.getElementById('confetti'), cctx=conf.getContext('2d');
let cps=[],cactive=false;
function sizeConf(){conf.width=innerWidth;conf.height=innerHeight;}
sizeConf();addEventListener('resize',()=>{sizeConf();});
function fireConfetti(){
  cactive=true;cps=[];
  const cols=['#26A69A','#5B8DEF','#F5B82E','#9B7BF0','#EF5350','#fff'];
  for(let i=0;i<120;i++)cps.push({x:Math.random()*conf.width,y:-20,vx:(Math.random()-.5)*6,vy:Math.random()*4+2,col:cols[~~(Math.random()*cols.length)],sz:Math.random()*8+4,rot:Math.random()*6,rs:(Math.random()-.5)*.3});
  loopConf();setTimeout(()=>cactive=false,4000);
}
function loopConf(){
  if(!cactive){cctx.clearRect(0,0,conf.width,conf.height);return;}
  cctx.clearRect(0,0,conf.width,conf.height);
  cps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.rot+=p.rs;
    cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.rot);cctx.fillStyle=p.col;cctx.globalAlpha=Math.max(0,1-p.y/conf.height);
    cctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);cctx.restore();});
  cps=cps.filter(p=>p.y<conf.height+40);
  requestAnimationFrame(loopConf);
}

/* boot */
render();
</script>

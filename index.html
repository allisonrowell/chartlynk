<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChartLYNK — Read Market Structure</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E17; --panel:#121826; --panel2:#1A2235; --line:rgba(255,255,255,.07);
  --text:#E8ECF5; --sub:#8B95A8; --dim:#5A6478;
  --accent:#5B8DEF; --accent2:#4A7BD8;
  --green:#26A69A; --greenL:#4DD0C4; --red:#EF5350; --redL:#FF7B78;
  --gold:#F5B82E; --purple:#9B7BF0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;font-size:15px;line-height:1.5;
}
#app{min-height:100vh;display:flex;flex-direction:column}

/* ── Top bar ── */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;background:rgba(10,14,23,.9);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem;letter-spacing:-.3px;cursor:pointer}
.brand .logo{
  width:28px;height:28px;border-radius:7px;
  background:linear-gradient(135deg,var(--green),var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.brand .x{color:var(--accent)}
.top-right{display:flex;align-items:center;gap:14px}
.streak{display:flex;align-items:center;gap:5px;font-size:.85rem;font-weight:700;color:var(--gold)}
.xp-pill{
  display:flex;align-items:center;gap:5px;font-size:.82rem;font-weight:700;
  color:var(--accent);background:rgba(91,141,239,.12);
  border:1px solid rgba(91,141,239,.25);border-radius:8px;padding:4px 10px;
}

/* ── Layout ── */
.wrap{max-width:920px;width:100%;margin:0 auto;padding:22px 18px 60px}

/* ── Hero ── */
.hero{text-align:center;padding:30px 0 18px}
.hero .kicker{font-size:.72rem;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:2.3rem;font-weight:900;letter-spacing:-1px;margin:10px 0 6px;line-height:1.1}
.hero p{color:var(--sub);font-size:1.05rem;max-width:520px;margin:0 auto}
.hero .cta{margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ── Buttons ── */
.btn{
  font-family:'Inter',sans-serif;font-weight:700;font-size:.95rem;
  border:none;border-radius:11px;padding:13px 22px;cursor:pointer;
  transition:transform .12s,box-shadow .12s,background .12s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(91,141,239,.3)}
.btn-primary:hover{background:var(--accent2)}
.btn-green{background:var(--green);color:#04201D;box-shadow:0 6px 20px rgba(38,166,154,.25)}
.btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{background:#222c42}
.btn-sm{padding:8px 14px;font-size:.85rem;border-radius:9px}
.btn-block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ── Section label ── */
.sec-label{font-size:.72rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:28px 0 12px}

/* ── Curriculum cards ── */
.track-grid{display:grid;grid-template-columns:1fr;gap:12px}
.track-card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;
  transition:border-color .15s,transform .15s,background .15s;
}
.track-card:hover{border-color:rgba(91,141,239,.4);transform:translateX(3px);background:var(--panel2)}
.track-card.locked{opacity:.5;cursor:not-allowed}
.track-card.locked:hover{transform:none;border-color:var(--line);background:var(--panel)}
.track-num{
  width:42px;height:42px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;font-weight:900;
}
.track-info{flex:1;min-width:0}
.track-name{font-weight:800;font-size:1.02rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.track-desc{color:var(--sub);font-size:.85rem;margin-top:2px}
.track-meta{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--dim);margin-top:6px}
.pill{font-size:.66rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.pill-done{background:rgba(38,166,154,.15);color:var(--greenL)}
.pill-prog{background:rgba(245,184,46,.15);color:var(--gold)}
.pill-new{background:rgba(91,141,239,.15);color:var(--accent)}
.pill-soon{background:rgba(255,255,255,.06);color:var(--dim)}
.track-arrow{color:var(--dim);font-size:1.3rem}

/* progress bar inside card */
.mini-prog{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:8px}
.mini-prog>div{height:100%;background:linear-gradient(90deg,var(--green),var(--accent));border-radius:3px;transition:width .4s}

/* ── Stats row ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat .big{font-size:1.6rem;font-weight:900;letter-spacing:-.5px}
.stat .lbl{font-size:.72rem;color:var(--sub);font-weight:600;margin-top:2px}

/* ── Lesson screen ── */
.lesson-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.lesson-top .crumbs{font-size:.82rem;color:var(--sub);font-weight:600}
.lesson-top .crumbs b{color:var(--text)}
.prog-line{height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:6px}
.prog-line>div{height:100%;background:linear-gradient(90deg,var(--green),var(--accent));border-radius:4px;transition:width .4s}
.step-dots{display:flex;gap:5px;margin-bottom:20px;flex-wrap:wrap}
.step-dots .d{flex:1;min-width:14px;height:4px;border-radius:2px;background:rgba(255,255,255,.1)}
.step-dots .d.done{background:var(--green)}
.step-dots .d.cur{background:var(--gold)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h2{font-size:1.4rem;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.card .lead{color:var(--sub);font-size:.95rem;margin-bottom:18px}
.card p{color:var(--text);margin-bottom:14px;font-size:.96rem}
.card p.muted{color:var(--sub)}

.concept{
  background:var(--panel2);border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;padding:14px 16px;margin:16px 0;font-size:.92rem;
}
.concept .ct{font-size:.7rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.concept.warn{border-left-color:var(--gold)}
.concept.warn .ct{color:var(--gold)}

.term-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.term{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:.82rem}
.term-btn{font-family:'Inter',sans-serif;color:var(--text);cursor:pointer;transition:border-color .12s,background .12s,transform .1s;text-align:left}
.term-btn:hover{border-color:rgba(91,141,239,.5);background:#222c42;transform:translateY(-1px)}
.term-btn.active{border-color:var(--accent);background:rgba(91,141,239,.18);box-shadow:0 0 0 1px var(--accent)}
.term-btn b{color:var(--accent)}
.anatomy-hint{font-size:.78rem;color:var(--dim);margin:-4px 0 6px}
.term b{color:var(--accent)}

.chart-cap{font-size:.8rem;color:var(--dim);text-align:center;margin-top:8px;font-style:italic}

.nav-row{display:flex;gap:10px;margin-top:22px}

/* ── Quiz ── */
.quiz-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.quiz-q{font-size:1.1rem;font-weight:700;margin-bottom:16px}
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.opt{
  background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;
  padding:14px 16px;cursor:pointer;font-size:.92rem;font-weight:600;
  transition:border-color .12s,background .12s;display:flex;gap:10px;align-items:center;
}
.opt:hover:not(.dis){border-color:rgba(91,141,239,.5);background:#222c42}
.opt .key{
  width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78rem;flex-shrink:0;
}
.opt.correct{border-color:var(--green);background:rgba(38,166,154,.12)}
.opt.correct .key{background:var(--green);color:#04201D}
.opt.wrong{border-color:var(--red);background:rgba(239,83,80,.1)}
.opt.wrong .key{background:var(--red);color:#fff}
.opt.dis{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-radius:11px;font-size:.9rem;line-height:1.55}
.explain.ok{background:rgba(38,166,154,.1);border:1px solid rgba(38,166,154,.3);color:var(--greenL)}
.explain.no{background:rgba(239,83,80,.1);border:1px solid rgba(239,83,80,.3);color:var(--redL)}

/* ── Practice (interactive charting) ── */
.practice-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.practice-head h2{font-size:1.3rem;font-weight:800}
.tool-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tool{
  background:var(--panel2);border:1.5px solid var(--line);border-radius:9px;
  padding:8px 13px;cursor:pointer;font-size:.82rem;font-weight:700;
  display:flex;align-items:center;gap:6px;transition:all .12s;color:var(--sub);
}
.tool:hover{border-color:rgba(255,255,255,.2);color:var(--text)}
.tool.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tool .dot{width:10px;height:10px;border-radius:50%}
.chart-shell{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;position:relative}
#chart{width:100%;display:block;border-radius:8px;cursor:crosshair;touch-action:none}
.chart-hint{font-size:.8rem;color:var(--dim);margin-top:10px;display:flex;align-items:center;gap:6px}
.practice-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.task-card{
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:14px;
}
.task-card .tlabel{font-size:.7rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
.task-card .ttext{font-size:.95rem;font-weight:600}
.feedback-banner{
  border-radius:11px;padding:13px 16px;margin-top:14px;font-size:.92rem;font-weight:600;
  display:none;animation:slideDown .3s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.feedback-banner.show{display:block}
.feedback-banner.ok{background:rgba(38,166,154,.12);border:1px solid rgba(38,166,154,.35);color:var(--greenL)}
.feedback-banner.no{background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.35);color:var(--redL)}

/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--sub);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* complete */
.complete{text-align:center;padding:40px 0}
.complete .check{
  width:80px;height:80px;border-radius:50%;margin:0 auto 18px;
  background:rgba(38,166,154,.15);border:2px solid var(--green);
  display:flex;align-items:center;justify-content:center;font-size:2.5rem;
}
.complete h2{font-size:1.8rem;font-weight:900;margin-bottom:8px}
.complete p{color:var(--sub);margin-bottom:6px}
.reward{display:inline-flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 18px;margin:14px 0;font-weight:700;color:var(--gold)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:999}

.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:560px){
  .hero h1{font-size:1.9rem}
  .wrap{padding:18px 14px 50px}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="app"></div>

<script>
"use strict";

/* ════════════════════════════════════════════════════
   CANDLE DATA GENERATION
   Deterministic seeded generator so charts are stable.
════════════════════════════════════════════════════ */
function mulberry32(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
// Generate candles with a chosen "shape": uptrend, downtrend, range, hh-hl, etc.
function genCandles(seed, n, opts={}){
  const r=mulberry32(seed);
  const drift=opts.drift||0;            // per-candle bias
  const vol=opts.vol||1.2;              // volatility
  let price=opts.start||100;
  const out=[];
  for(let i=0;i<n;i++){
    const open=price;
    let move=(r()-0.5)*2*vol + drift;
    // optional waypoints to force structure
    if(opts.wave){
      move += Math.sin(i/opts.wave.period)*opts.wave.amp;
    }
    const close=Math.max(1, open+move);
    const wickUp=r()*vol*0.9;
    const wickDn=r()*vol*0.9;
    const high=Math.max(open,close)+wickUp;
    const low=Math.min(open,close)-wickDn;
    out.push({open,high,low,close});
    price=close;
  }
  return out;
}
// Build candles passing through explicit pivot points (for structure lessons)
function candlesThroughPivots(pivots, perLeg, seed){
  const r=mulberry32(seed);
  const out=[];
  for(let p=0;p<pivots.length-1;p++){
    const a=pivots[p], b=pivots[p+1];
    for(let i=0;i<perLeg;i++){
      const t=i/perLeg, t2=(i+1)/perLeg;
      const base=a+(b-a)*t;
      const nextBase=a+(b-a)*t2;
      const open=base+(r()-0.5)*1.0;
      const close=nextBase+(r()-0.5)*1.0;
      const high=Math.max(open,close)+r()*1.4;
      const low=Math.min(open,close)-r()*1.4;
      out.push({open,high,low,close});
    }
  }
  return out;
}

/* ════════════════════════════════════════════════════
   CHART RENDERER (canvas, candlesticks)
════════════════════════════════════════════════════ */
class Chart{
  constructor(canvas, candles, cfg={}){
    this.cv=canvas; this.ctx=canvas.getContext('2d');
    this.candles=candles;
    this.cfg=Object.assign({padL:8,padR:54,padT:14,padB:24,grid:true},cfg);
    this.overlays=cfg.overlays||[];    // static drawn objects {type,...}
    this.userLines=[];                 // user-drawn horizontal/trend lines
    this.userMarks=[];                 // user-placed point markers {x,y,label,color}
    this.dpr=window.devicePixelRatio||1;
    this._resize();
    this._computeScale();
  }
  _resize(){
    const rect=this.cv.getBoundingClientRect();
    this.w=rect.width||640; this.h=this.cfg.height||340;
    this.cv.width=this.w*this.dpr; this.cv.height=this.h*this.dpr;
    this.cv.style.height=this.h+'px';
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
  }
  _computeScale(){
    let min=Infinity,max=-Infinity;
    for(const c of this.candles){ if(c.low<min)min=c.low; if(c.high>max)max=c.high; }
    const range=(max-min)||1;
    this.min=min-range*(this.cfg.padBotFrac||0.08);
    this.max=max+range*(this.cfg.padTopFrac||0.08);
    this.plotL=this.cfg.padL; this.plotR=this.w-this.cfg.padR;
    this.plotT=this.cfg.padT; this.plotB=this.h-this.cfg.padB;
    this.plotW=this.plotR-this.plotL; this.plotH=this.plotB-this.plotT;
    this.cw=this.plotW/this.candles.length;     // candle slot width
  }
  xOf(i){ return this.plotL + i*this.cw + this.cw/2; }
  yOf(p){ return this.plotB - (p-this.min)/(this.max-this.min)*this.plotH; }
  priceAt(y){ return this.min + (this.plotB-y)/this.plotH*(this.max-this.min); }
  indexAt(x){ return Math.floor((x-this.plotL)/this.cw); }

  draw(){
    const c=this.ctx;
    c.clearRect(0,0,this.w,this.h);
    // background
    c.fillStyle='#0E1420'; c.fillRect(0,0,this.w,this.h);
    // grid + price axis
    if(this.cfg.grid){
      c.strokeStyle='rgba(255,255,255,.05)'; c.lineWidth=1;
      c.fillStyle='#5A6478'; c.font='10px Inter'; c.textAlign='left';
      const steps=5;
      for(let i=0;i<=steps;i++){
        const p=this.min+(this.max-this.min)*i/steps;
        const y=this.yOf(p);
        c.beginPath(); c.moveTo(this.plotL,y); c.lineTo(this.plotR,y); c.stroke();
        c.fillText(p.toFixed(1), this.plotR+6, y+3);
      }
    }
    // static overlays (drawn behind candles if zones)
    for(const o of this.overlays){ if(o.type==='zone') this._drawZone(o); }
    // candles
    const bodyW=Math.max(2,Math.min(this.cw*0.62,16));
    for(let i=0;i<this.candles.length;i++){
      const cd=this.candles[i], x=this.xOf(i);
      const up=cd.close>=cd.open;
      const col=up?'#26A69A':'#EF5350';
      c.strokeStyle=col; c.fillStyle=col; c.lineWidth=1.4;
      // wick
      c.beginPath(); c.moveTo(x,this.yOf(cd.high)); c.lineTo(x,this.yOf(cd.low)); c.stroke();
      // body
      const yO=this.yOf(cd.open), yC=this.yOf(cd.close);
      const top=Math.min(yO,yC), bh=Math.max(2,Math.abs(yC-yO));
      c.fillRect(x-bodyW/2, top, bodyW, bh);
    }
    // static line overlays (support/resistance/trend/labels) on top
    for(const o of this.overlays){
      if(o.type==='hline') this._drawHLine(o);
      else if(o.type==='tline') this._drawTLine(o);
      else if(o.type==='label') this._drawLabel(o);
      else if(o.type==='pivot') this._drawPivot(o);
    }
    // user drawings
    for(const l of this.userLines) this._drawUserLine(l);
    for(const m of this.userMarks) this._drawUserMark(m);
    // interactive anatomy spotlight
    if(this.highlight) this._spotlight();
  }

  _spotlight(){
    const c=this.ctx, h=this.highlight;
    // dim everything so the highlighted part pops
    c.save();
    c.fillStyle='rgba(8,11,18,.66)';
    c.fillRect(0,0,this.w,this.h);
    c.restore();
    const bodyW=Math.max(2,Math.min(this.cw*0.62,16));
    const drawWick=(cd,x,col)=>{
      c.save();
      c.shadowColor=col; c.shadowBlur=16;
      c.strokeStyle=col; c.lineWidth=2.6; c.lineCap='round';
      c.beginPath(); c.moveTo(x,this.yOf(cd.high)); c.lineTo(x,this.yOf(cd.low)); c.stroke();
      c.lineWidth=3.2;
      c.beginPath(); c.moveTo(x-7,this.yOf(cd.high)); c.lineTo(x+7,this.yOf(cd.high)); c.stroke();
      c.beginPath(); c.moveTo(x-7,this.yOf(cd.low)); c.lineTo(x+7,this.yOf(cd.low)); c.stroke();
      c.restore();
    };
    const drawBody=(cd,x,col)=>{
      const yO=this.yOf(cd.open), yC=this.yOf(cd.close);
      const top=Math.min(yO,yC), bh=Math.max(2,Math.abs(yC-yO));
      c.save();
      c.shadowColor=col; c.shadowBlur=20;
      c.fillStyle=col; c.fillRect(x-bodyW/2, top, bodyW, bh);
      c.lineWidth=2; c.strokeStyle='#fff'; c.strokeRect(x-bodyW/2, top, bodyW, bh);
      c.restore();
    };
    const drawHalfWick=(cd,x,col,upper)=>{
      const bodyTop=Math.min(this.yOf(cd.open),this.yOf(cd.close));
      const bodyBot=Math.max(this.yOf(cd.open),this.yOf(cd.close));
      c.save();
      c.shadowColor=col; c.shadowBlur=16;
      c.strokeStyle=col; c.lineWidth=2.6; c.lineCap='round';
      if(upper){ c.beginPath(); c.moveTo(x,this.yOf(cd.high)); c.lineTo(x,bodyTop); c.stroke();
        c.lineWidth=3.2; c.beginPath(); c.moveTo(x-7,this.yOf(cd.high)); c.lineTo(x+7,this.yOf(cd.high)); c.stroke(); }
      else { c.beginPath(); c.moveTo(x,bodyBot); c.lineTo(x,this.yOf(cd.low)); c.stroke();
        c.lineWidth=3.2; c.beginPath(); c.moveTo(x-7,this.yOf(cd.low)); c.lineTo(x+7,this.yOf(cd.low)); c.stroke(); }
      c.restore();
    };
    const structureKeys=['HH','HL','LH','LL'];
    if(structureKeys.includes(h)){
      // re-draw the candles at full opacity, then ring the matching pivots
      for(let i=0;i<this.candles.length;i++){
        const cd=this.candles[i], x=this.xOf(i), up=cd.close>=cd.open, col=up?'#26A69A':'#EF5350';
        c.strokeStyle=col; c.fillStyle=col; c.lineWidth=1.4;
        c.beginPath(); c.moveTo(x,this.yOf(cd.high)); c.lineTo(x,this.yOf(cd.low)); c.stroke();
        const yO=this.yOf(cd.open), yC=this.yOf(cd.close);
        c.fillRect(x-bodyW/2, Math.min(yO,yC), bodyW, Math.max(2,Math.abs(yC-yO)));
      }
      for(const o of this.overlays){
        if(o.type!=='pivot' || o.label!==h) continue;
        const x=this.xOf(o.i), y=this.yOf(o.price);
        c.save();
        c.shadowColor='#9B7BF0'; c.shadowBlur=18;
        c.strokeStyle='#fff'; c.lineWidth=2.6; c.beginPath(); c.arc(x,y,11,0,7); c.stroke();
        c.fillStyle='#9B7BF0'; c.beginPath(); c.arc(x,y,4.5,0,7); c.fill();
        c.fillStyle='#fff'; c.font='bold 12px Inter'; c.textAlign='center';
        c.fillText(o.label, x, y+(o.top?-18:24));
        c.restore();
      }
    }
    for(let i=0;i<this.candles.length;i++){
      const cd=this.candles[i], x=this.xOf(i);
      const up=cd.close>=cd.open, col=up?'#26A69A':'#EF5350';
      if(h==='body') drawBody(cd,x,col);
      else if(h==='wick') drawWick(cd,x,'#F5B82E');
      else if(h==='upper') drawHalfWick(cd,x,'#FF7B78',true);
      else if(h==='lower') drawHalfWick(cd,x,'#4DD0C4',false);
      else if(h==='green' && up){ drawWick(cd,x,'#26A69A'); drawBody(cd,x,'#26A69A'); }
      else if(h==='red' && !up){ drawWick(cd,x,'#EF5350'); drawBody(cd,x,'#EF5350'); }
    }
    const labels={body:'BODY — the open-to-close range',wick:'WICK / SHADOW — the high & low extremes',green:'GREEN — close above open (bullish)',red:'RED — close below open (bearish)',upper:'UPPER WICK — sellers rejected higher prices',lower:'LOWER WICK — buyers rejected lower prices',HH:'HIGHER HIGH — each peak above the last',HL:'HIGHER LOW — each dip above the last',LH:'LOWER HIGH — each peak below the last',LL:'LOWER LOW — each dip below the last'};
    const cols={body:'#fff',wick:'#F5B82E',green:'#4DD0C4',red:'#FF7B78',upper:'#FF7B78',lower:'#4DD0C4',HH:'#9B7BF0',HL:'#9B7BF0',LH:'#9B7BF0',LL:'#9B7BF0'};
    c.save();
    c.fillStyle=cols[h]||'#fff'; c.font='bold 12px Inter'; c.textAlign='center';
    c.fillText(labels[h]||'', this.w/2, this.plotT+4);
    c.restore();
  }
  hitTest(px,py,mode){
    if(mode==='structure'){
      let best=null,bd=1e9;
      for(const o of this.overlays){ if(o.type!=='pivot') continue;
        const d=Math.hypot(px-this.xOf(o.i),py-this.yOf(o.price));
        if(d<bd){bd=d;best=o;}
      }
      return (best && bd<46) ? best.label : null;
    }
    // candle-based modes: find nearest candle by x
    let i=Math.round((px-this.plotL-this.cw/2)/this.cw);
    i=Math.max(0,Math.min(this.candles.length-1,i));
    const cd=this.candles[i], x=this.xOf(i);
    if(Math.abs(px-x)>this.cw*0.9) return null;
    const yHigh=this.yOf(cd.high), yLow=this.yOf(cd.low);
    const bodyTop=Math.min(this.yOf(cd.open),this.yOf(cd.close));
    const bodyBot=Math.max(this.yOf(cd.open),this.yOf(cd.close));
    const up=cd.close>=cd.open;
    if(mode==='anatomy'){
      if(py>=bodyTop-3 && py<=bodyBot+3) return 'body';
      if(py>=yHigh-6 && py<=yLow+6) return 'wick';
      return null;
    }
    if(mode==='wicks'){
      if(py<bodyTop && py>=yHigh-8) return 'upper';
      if(py>bodyBot && py<=yLow+8) return 'lower';
      return null;
    }
    return null;
  }
  _drawZone(o){
    const c=this.ctx;
    const y1=this.yOf(o.priceHigh), y2=this.yOf(o.priceLow);
    c.fillStyle=o.color||'rgba(91,141,239,.12)';
    c.fillRect(this.plotL,Math.min(y1,y2),this.plotW,Math.abs(y2-y1));
  }
  _drawHLine(o){
    const c=this.ctx, y=this.yOf(o.price);
    c.strokeStyle=o.color||'#5B8DEF'; c.lineWidth=o.width||1.5;
    c.setLineDash(o.dash||[6,4]);
    c.beginPath(); c.moveTo(this.plotL,y); c.lineTo(this.plotR,y); c.stroke();
    c.setLineDash([]);
    if(o.label){
      c.fillStyle=o.color||'#5B8DEF'; c.font='bold 10px Inter'; c.textAlign='left';
      c.fillText(o.label,this.plotL+4,y-5);
    }
  }
  _drawTLine(o){
    const c=this.ctx;
    const x1=this.xOf(o.i1), y1=this.yOf(o.p1), x2=this.xOf(o.i2), y2=this.yOf(o.p2);
    c.strokeStyle=o.color||'#F5B82E'; c.lineWidth=o.width||2;
    c.setLineDash(o.dash||[]);
    c.beginPath(); c.moveTo(x1,y1);
    // extend
    const dx=x2-x1, dy=y2-y1;
    const ext=o.extend? (this.plotR-x2)/(dx||1):0;
    c.lineTo(x2+dx*ext, y2+dy*ext); c.stroke();
    c.setLineDash([]);
    if(o.label){
      c.fillStyle=o.color||'#F5B82E'; c.font='bold 10px Inter'; c.textAlign='left';
      c.fillText(o.label,x2+4,y2-4);
    }
  }
  _drawPivot(o){
    const c=this.ctx, x=this.xOf(o.i), y=this.yOf(o.price);
    const off=o.top? -14:14;
    c.fillStyle=o.color||'#9B7BF0';
    c.beginPath(); c.arc(x,y,3.5,0,7); c.fill();
    c.font='bold 11px Inter'; c.textAlign='center';
    c.fillText(o.label, x, y+off+ (o.top?0:4));
  }
  _drawLabel(o){
    const c=this.ctx;
    c.fillStyle=o.color||'#E8ECF5'; c.font='bold 11px Inter'; c.textAlign=o.align||'center';
    c.fillText(o.text, o.x!=null?o.x:this.xOf(o.i), o.y!=null?o.y:this.yOf(o.price));
  }
  _drawUserLine(l){
    const c=this.ctx;
    c.strokeStyle=l.color; c.lineWidth=2; c.setLineDash(l.type==='h'?[2,3]:[]);
    c.beginPath();
    if(l.type==='h'){ const y=this.yOf(l.price); c.moveTo(this.plotL,y); c.lineTo(this.plotR,y); }
    else { c.moveTo(l.x1,l.y1); c.lineTo(l.x2,l.y2); }
    c.stroke(); c.setLineDash([]);
  }
  _drawUserMark(m){
    const c=this.ctx;
    c.fillStyle=m.color; c.beginPath(); c.arc(m.x,m.y,5,0,7); c.fill();
    c.strokeStyle='#fff'; c.lineWidth=1.5; c.stroke();
    if(m.label){
      c.fillStyle='#fff'; c.font='bold 11px Inter'; c.textAlign='center';
      c.fillText(m.label, m.x, m.y- (m.up?10:-18));
    }
  }
}

    name:'Chart Patterns',
    desc:'Double tops/bottoms, head & shoulders, triangles, flags.',
    steps:[
      {type:'lesson', title:'Double Tops & Bottoms',
       lead:'Price tests a level twice and fails.',
       body:`<p>A <b>double top</b> forms when price rallies to a high, pulls back, rallies to the same high again, and fails. Two peaks at one level = sellers defending. The pattern confirms when price breaks below the <b>neckline</b> (the pullback low).</p>
       <p>A <b>double bottom</b> is the bullish mirror: two lows at the same level, confirming on a break above the neckline.</p>`,
       chart:'cp-doubles',
       cap:'A double bottom: two lows at support, breakout above the neckline.',
       concept:{t:'Measured move',body:'A rough target after the break = the height of the pattern projected from the neckline.'}
      },
      {type:'lesson', title:'Head & Shoulders',
       lead:'The classic reversal: three peaks.',
       body:`<p>A <b>head and shoulders</b> top has three peaks: a high (left shoulder), a higher high (head), and a lower high (right shoulder). It signals an uptrend losing strength. The break of the <b>neckline</b> (connecting the two valleys) confirms the reversal.</p>
       <p>An <b>inverse head & shoulders</b> is the bottoming version — three troughs, breaking up through the neckline.</p>`,
       chart:'cp-hns',
       cap:'Head & shoulders top: shoulder, higher head, lower shoulder, neckline break.',
       concept:{t:'Why it works',body:'It\'s really just market structure: the lower right shoulder is the first lower high — a change of character.'}
      },
      {type:'lesson', title:'Triangles, Wedges & Flags',
       lead:'Consolidation before continuation.',
       body:`<p><b>Triangles</b> form as price coils into a tighter range — ascending (flat top, rising lows = bullish), descending (flat bottom, falling highs = bearish), or symmetrical.</p>
       <p>A <b>flag</b> is a brief, tilted pullback after a sharp move — a pause before the trend resumes. These are continuation patterns: they usually break in the direction of the prior trend.</p>`,
       chart:'cp-triangle',
       cap:'An ascending triangle: flat resistance, rising support, breakout up.',
       concept:{t:'Trader tip',body:'Wait for the breakout AND a retest of the broken line. Chasing the first break gets you faked out.'}
      },
      {type:'quiz', q:'Price hits $80, pulls back, hits $80 again and fails, then breaks the pullback low. This is a…',
       opts:['Double bottom','Bull flag','Double top','Ascending triangle'],
       answer:2,
       exp:'Two failed peaks at the same level + a neckline break down = double top. A bearish reversal pattern.'
      },
      {type:'quiz', q:'A head & shoulders top is confirmed when price…',
       opts:['Makes a higher head','Breaks below the neckline','Forms the left shoulder','Hits a new high'],
       answer:1,
       exp:'The pattern only confirms on the neckline break. Until then it\'s just a potential shape.'
      },
      {type:'practice', title:'Draw the Neckline',
       task:'This is a double bottom. The neckline is the resistance level at the peak between the two lows. Select "Neckline" and click on that level.',
       chart:'practice-neckline', tool:'level', toolLabel:'Neckline', toolColor:'#5B8DEF', checkType:'levelNear',
       hint:'Find the high point BETWEEN the two bottoms — a break above it confirms the pattern.',
       okMsg:'Correct. A close above this neckline confirms the double bottom and projects the measured move up.',
       failMsg:'Not quite — the neckline sits at the peak between the two lows, not at the lows themselves.',
       noDrawMsg:'Select the Neckline tool and click on the level.'
      },
    ]
  },

    id:'fib', num:'8', icon:'🌀', color:'#F5B82E',
    name:'Fibonacci',
    desc:'Retracements, the golden pocket, and extension targets.',
    steps:[
      {type:'lesson', title:'Fibonacci Retracements',
       lead:'How deep will a pullback go?',
       body:`<p>After an impulse move, price pulls back before continuing. <b>Fibonacci retracement</b> levels — 23.6%, 38.2%, 50%, 61.8%, 78.6% — mark common pullback depths where price tends to find support and resume.</p>
       <p>You anchor the tool from the start of the move (the swing low) to the end (the swing high). The levels appear in between.</p>`,
       chart:'fib-retrace',
       cap:'Fib retracement drawn from swing low to swing high, levels marked.',
       concept:{t:'Key idea',body:'Fibs aren\'t magic — they work because so many traders watch the same levels. They become self-fulfilling zones of interest.'}
      },
      {type:'lesson', title:'The Golden Pocket',
       lead:'The 0.618–0.65 sweet spot.',
       body:`<p>The <b>golden pocket</b> is the zone between the 0.618 and 0.65 retracement levels. It's the area many traders consider the highest-probability spot for a trend to resume.</p>
       <p>A pullback into the golden pocket that aligns with a support level or an order block is a high-confluence entry.</p>`,
       chart:'fib-pocket',
       cap:'Price pulls back into the golden pocket (0.618) and bounces.',
       concept:{t:'Confluence',body:'One signal is a guess. The golden pocket + support + a bullish engulfing candle = a real edge.'}
      },
      {type:'lesson', title:'Fibonacci Extensions',
       lead:'Where might price go next?',
       body:`<p>While retracements measure pullbacks, <b>extensions</b> project targets BEYOND the prior high. Common extension levels are 1.272, 1.618, and 2.618.</p>
       <p>Traders use them to set take-profit targets: after entering at the golden pocket, the 1.618 extension is a frequent first target.</p>`,
       chart:'fib-ext',
       cap:'Extension levels (1.272, 1.618) projected above as profit targets.',
       concept:{t:'Plan the exit',body:'Knowing your target before you enter lets you calculate risk:reward — the foundation of every good trade.'}
      },
      {type:'quiz', q:'The "golden pocket" refers to which retracement zone?',
       opts:['23.6%–38.2%','around 0.618–0.65','78.6%–88.6%','exactly 0.5'],
       answer:1,
       exp:'The golden pocket is ~0.618–0.65 — the highest-probability area for a trend to resume after a pullback.'
      },
      {type:'quiz', q:'Fibonacci EXTENSIONS are mainly used to…',
       opts:['Measure pullback depth','Project profit targets beyond the high','Draw trendlines','Find support below'],
       answer:1,
       exp:'Extensions (1.272, 1.618, 2.618) project targets beyond the prior swing — used for take-profits.'
      },
      {type:'practice', title:'Mark the Golden Pocket',
       task:'Price made an impulse up and is pulling back. Mark the golden-pocket level (~61.8% retracement) where the trend is likely to resume. Select "0.618" and click that level.',
       chart:'practice-fib', tool:'level', toolLabel:'0.618 pocket', toolColor:'#F5B82E', checkType:'levelNear',
       hint:'The 0.618 level sits about two-thirds of the way DOWN from the high back toward the low of the impulse.',
       okMsg:'Nice. That\'s the golden pocket — the highest-probability area for buyers to step back in.',
       failMsg:'Close, but the 0.618 pocket is deeper than the halfway point — about two-thirds back toward the low.',
       noDrawMsg:'Select the 0.618 tool and click on the level.'
      },
    ]
  },

    id:'ob', num:'9', icon:'🧱', color:'#9B7BF0',
    name:'Order Blocks & FVG',
    desc:'Smart-money zones: order blocks and fair value gaps.',
    steps:[
      {type:'lesson', title:'What is an Order Block?',
       lead:'The last candle before the move.',
       body:`<p>An <b>order block</b> is the last opposite-colored candle before a strong, decisive move. A <b>bullish order block</b> is the last DOWN candle before a big rally — it marks where institutions loaded up.</p>
       <p>When price returns to that candle's zone later, it often reacts there — making the order block a precise entry area.</p>`,
       chart:'ob-what',
       cap:'The last down candle before the rally = the bullish order block.',
       concept:{t:'Why it matters',body:'Institutions leave footprints. The order block is where their unfilled orders likely still rest.'}
      },
      {type:'lesson', title:'Fair Value Gaps (FVG)',
       lead:'An imbalance the market wants to fill.',
       body:`<p>A <b>fair value gap</b> is a 3-candle imbalance: a big middle candle leaves a "gap" between the wick of candle 1 and the wick of candle 3 — a price range that traded too fast, with one-sided action.</p>
       <p>Markets tend to <b>return to fill</b> these gaps before continuing. An unfilled FVG acts like a magnet and a potential entry zone.</p>`,
       chart:'ob-fvg',
       cap:'A fair value gap (shaded) left by a fast candle — price returns to fill it.',
       concept:{t:'Tell',body:'FVG + order block + golden pocket stacking in the same area is a textbook smart-money entry.'}
      },
      {type:'lesson', title:'Trading the Order Block',
       lead:'Wait for the return.',
       body:`<p>The play: identify the order block that caused a break of structure, then wait for price to <b>pull back</b> into it. Enter in the direction of the original move, with a stop just beyond the order block.</p>
       <p>This gives you tight, defined risk and a clear invalidation: if price closes through the block, the idea is wrong.</p>`,
       chart:'ob-trade',
       cap:'Price returns to the bullish order block, reacts, and continues up.',
       concept:{t:'Risk',body:'The order block\'s far edge is your stop. Small risk, structured entry — the smart-money template.'}
      },
      {type:'quiz', q:'A bullish order block is…',
       opts:['The biggest green candle','The last down candle before a strong rally','Any support level','A doji at the top'],
       answer:1,
       exp:'A bullish order block is the last DOWN candle before a decisive up-move — where institutions accumulated.'
      },
      {type:'quiz', q:'A fair value gap (FVG) is created by…',
       opts:['A slow, sideways market','A 3-candle imbalance from a fast move','A double top','A long lower wick'],
       answer:1,
       exp:'An FVG is a 3-candle imbalance — a fast move leaves an unfilled price gap the market tends to revisit.'
      },
      {type:'practice', title:'Mark the Order Block',
       task:'Find the bullish order block — the last down candle before the strong rally. Select "Order block" and click on that candle\'s zone.',
       chart:'practice-ob', tool:'level', toolLabel:'Order block', toolColor:'#9B7BF0', checkType:'levelNear',
       hint:'Scan to just before the big rally began. The last RED candle before that surge is the order block.',
       okMsg:'Exactly. That last down candle is the bullish order block — a precise zone to watch on a pullback.',
       failMsg:'Not quite. The order block is the last DOWN candle immediately before the strong rally started.',
       noDrawMsg:'Select the Order block tool and click on the candle\'s level.'
      },
    ]
  },

    id:'liq', num:'10', icon:'💧', color:'#3D9BFF',
    name:'Liquidity & Smart Money',
    desc:'Equal highs/lows, liquidity pools, inducement & stop hunts.',
    steps:[
      {type:'lesson', title:'Where Liquidity Rests',
       lead:'Stops cluster in obvious places.',
       body:`<p><b>Liquidity</b> is just a pool of pending orders — mostly stop-losses. They cluster where they're predictable: just above <b>equal highs</b> and just below <b>equal lows</b>, and beyond obvious support/resistance.</p>
       <p>Big players need this liquidity to fill large orders, so price is often drawn toward these pools before the real move.</p>`,
       chart:'liq-equal',
       cap:'Equal highs — a pool of stop orders rests just above them.',
       concept:{t:'Reframe',body:'Stop thinking "support/resistance." Start thinking "where are the stops, and who wants them?"'}
      },
      {type:'lesson', title:'Liquidity Grabs & Stop Hunts',
       lead:'Sweep, then reverse.',
       body:`<p>A <b>stop hunt</b> (liquidity grab) is when price spikes just past an obvious level — triggering everyone's stops — then sharply reverses. The spike wasn't a breakout; it was harvesting liquidity.</p>
       <p>You saw this in the ICC track. Here's the key: the reversal AFTER the grab is the high-probability move, because the trapped traders become fuel.</p>`,
       chart:'liq-hunt',
       cap:'Price sweeps above equal highs (grab), traps breakout buyers, then dumps.',
       concept:{t:'Tell',body:'A sharp wick through an obvious level that immediately reverses = a grab, not a breakout.'}
      },
      {type:'lesson', title:'Inducement',
       lead:'The bait before the trap.',
       body:`<p><b>Inducement</b> is a minor, tempting level placed before the real zone — designed to lure traders in early. Price taps the inducement (triggering eager entries), grabs that liquidity, THEN moves to the real order block or zone.</p>
       <p>Recognizing inducement keeps you patient: you wait for the deeper, real level instead of taking the bait.</p>`,
       concept:{t:'Discipline',body:'If an entry looks too obvious and too early, ask: is this the real zone, or the bait before it?'}
      },
      {type:'quiz', q:'Stop-loss orders (liquidity) tend to cluster…',
       opts:['Randomly across the chart','Just beyond equal highs/lows and obvious levels','Only at the open','In the middle of a range'],
       answer:1,
       exp:'Liquidity pools where stops are predictable — just past equal highs/lows and obvious S/R.'
      },
      {type:'quiz', q:'Price spikes above equal highs, then immediately reverses down hard. That was most likely a…',
       opts:['Real breakout','Liquidity grab / stop hunt','Double bottom','Bull flag'],
       answer:1,
       exp:'A sharp sweep past an obvious level that instantly reverses = a liquidity grab, harvesting stops.'
      },
      {type:'practice', title:'Mark the Liquidity Pool',
       task:'Two highs sit at the same level (equal highs). Mark where the liquidity rests — the level the stops sit just above. Select "Liquidity" and click that level.',
       chart:'practice-liquidity', tool:'level', toolLabel:'Liquidity', toolColor:'#3D9BFF', checkType:'levelNear',
       hint:'Find the two peaks that top out at the same price. The liquidity pool sits right at that equal-highs level.',
       okMsg:'Right. Stops from breakout buyers and shorts rest just above these equal highs — prime liquidity to be swept.',
       failMsg:'Look for the two peaks that line up at the SAME price — that\'s where the liquidity pool sits.',
       noDrawMsg:'Select the Liquidity tool and click on the equal-highs level.'
      },
    ]

    name:'Multi-Timeframe Analysis',
    desc:'Top-down: set bias on the high timeframe, enter on the low.',
    steps:[
      {type:'lesson', title:'Why Timeframes Matter',
       lead:'The same chart tells different stories.',
       body:`<p>A market can be in an <b>uptrend on the daily</b> but a <b>downtrend on the 5-minute</b> at the same moment. Neither is wrong — they're different lenses.</p>
       <p>Trading one timeframe blindly gets you whipsawed. The fix is to align them: use a higher timeframe for direction and a lower one for timing.</p>`,
       chart:'mtf-why',
       cap:'A higher-timeframe uptrend contains many smaller pullbacks and ranges.',
       concept:{t:'Key idea',body:'Higher timeframes carry more weight. A daily level beats a 5-minute level every time.'}
      },
      {type:'lesson', title:'The Top-Down Approach',
       lead:'Zoom out for bias, zoom in for entry.',
       body:`<p>Step 1 — <b>HTF bias:</b> on the high timeframe, what's the trend and where are the key levels? That sets your direction (only longs in an uptrend).</p>
       <p>Step 2 — <b>LTF entry:</b> drop to a lower timeframe and wait for YOUR setup (order block, golden pocket, engulfing) in the direction of the HTF bias. This stacks the odds in your favor.</p>`,
       chart:'mtf-topdown',
       cap:'HTF says "up." On the LTF, you take the pullback into support — with the trend.',
       concept:{t:'The rule',body:'Trade the lower timeframe ONLY in the direction the higher timeframe allows. Bias first, entry second.'}
      },
      {type:'quiz', q:'The correct top-down workflow is:',
       opts:['Entry on HTF, bias on LTF','Bias on HTF, entry on LTF','Ignore the higher timeframe','Only ever use one timeframe'],
       answer:1,
       exp:'Set direction (bias) on the higher timeframe, then time your entry on the lower one — with that bias.'
      },
      {type:'quiz', q:'Daily is clearly UP. On the 5-min you get a clean short setup. You should…',
       opts:['Take the short — setups are setups','Be cautious; it fights the HTF bias','Always short','Close your charts'],
       answer:1,
       exp:'A counter-trend LTF setup fights the dominant HTF bias — lower odds. Favor entries that align with the higher timeframe.'

      {type:'practice', title:'Mark the HTF Level',

    id:'risk', num:'12', icon:'🛡️', color:'#EF5350',
    name:'Risk Management',
    desc:'Position sizing, risk:reward, the 1% rule, expectancy.',
    steps:[
      {type:'lesson', title:'The 1% Rule',
       lead:'Survival first. Profit second.',
       body:`<p>The single most important rule: never risk more than <b>1% of your account</b> on one trade. On a $10,000 account, that's $100 of risk per trade.</p>
       <p>Why? At 1% risk, you could lose 20 trades in a row and only be down ~18%. You stay in the game. Blow 20% on one trade and you now need a 25% gain just to break even.</p>`,
       concept:{t:'The math of ruin',body:'Lose 50% and you need +100% to recover. Big losses compound against you. Small, capped risk is non-negotiable.'}
      },
      {type:'lesson', title:'Risk : Reward',
       lead:'Only take trades that pay.',
       body:`<p><b>Risk:reward (R:R)</b> compares what you risk to what you aim to make. Risk $100 to make $300 = a 1:3 R:R, or "3R."</p>
       <p>With 1:3 trades you can be <b>wrong 60% of the time and still profit</b>. That's the power of asymmetry — your winners must outsize your losers.</p>`,
       chart:'rm-rr',
       cap:'Entry, stop (1R risk below), and target (3R above) = a 1:3 trade.',
       concept:{t:'Key idea',body:'Win rate alone means nothing. A 90% win rate at 1:0.1 R:R still loses money. Always weigh R:R.'}
      },
      {type:'lesson', title:'Position Sizing & Expectancy',
       lead:'Let the stop decide your size.',
       body:`<p>Your <b>position size</b> comes from your risk, not your gut. Formula: <b>Size = (Account × 1%) ÷ (distance to stop)</b>. A wider stop means a smaller position — so your dollar risk stays fixed at 1%.</p>
       <p><b>Expectancy</b> is your average profit per trade over many trades: (Win% × avg win) − (Loss% × avg loss). Positive expectancy + enough trades = a growing account.</p>`,
       concept:{t:'Mindset',body:'You can\'t control any single outcome. You CAN control your risk per trade. Master that and the math works for you.'}
      },
      {type:'quiz', q:'On a $5,000 account using the 1% rule, your max risk per trade is…',
       opts:['$500','$50','$5','$250'],
       answer:1,
       exp:'1% of $5,000 = $50. That\'s your maximum dollar risk on any single trade.'
      },
      {type:'quiz', q:'You risk $100 to make $300. If you win just 40% of the time over 10 trades, you…',
       opts:['Lose money','Break exactly even','Profit (4 wins × $300 − 6 losses × $100 = +$600)','Can\'t tell'],
       answer:2,
       exp:'4 wins × $300 = $1,200; 6 losses × $100 = $600. Net +$600. Good R:R lets you profit with a sub-50% win rate.'
      },

       okMsg:'Good placement — just below the swing low. Tight enough for solid R:R, with room to avoid a random wick.',

       noDrawMsg:'Select the Stop tool and click below the swing low.'

      {type:'lesson', title:'Confirmation & Entry',

       body:`<p>Arriving at your level isn\'t the entry — it\'s the <b>alert</b>. Now you wait for confirmation: a liquidity grab, a bullish engulfing candle, a shift in structure. The confirmation is what turns a level into a trade.</p>

  {
    id:'psych', num:'14', icon:'🧠', color:'#9B7BF0',
    name:'Trading Psychology',
    desc:'The mental game: discipline, emotion, and the brain on risk.',
    steps:[
      {type:'lesson', title:'Your Brain Is Not Built for This',
       lead:'Markets exploit hardwired instincts.',
       body:`<p>The same instincts that kept our ancestors alive sabotage traders. Your brain treats a losing trade like a physical threat — triggering fight-or-flight, flooding you with cortisol, and hijacking the rational, decision-making prefrontal cortex.</p>
       <p>This is why you can know the perfect plan and still abandon it the moment real money is on the line. <b>Trading is a performance task done under stress</b> — and the first skill is recognizing that your wiring is working against you.</p>`,
       concept:{t:'Reframe',body:'You will never fully eliminate emotion. The goal is not to feel nothing — it is to act on your plan despite what you feel.'}
      },
      {type:'lesson', title:'Loss Aversion & the Pain of Red',
       lead:'A loss hurts about twice as much as an equal gain feels good.',
       body:`<p><b>Loss aversion</b> is one of the most studied findings in behavioral science: the pain of losing $100 is roughly twice the pleasure of gaining $100. This single bias drives the most common trading mistakes.</p>
       <p>It is why traders <b>cut winners too early</b> (locking in the good feeling) and <b>let losers run</b> (avoiding the pain of realizing the loss) — the exact opposite of "cut losses, let winners run." Your stop-loss exists to make that decision before the pain arrives.</p>`,
       concept:{t:'The fix',body:'Pre-commit. Set your stop and target before you enter, when you are calm — then remove your ability to override them in the heat of the moment.'}
      },
      {type:'lesson', title:'FOMO, Revenge & Tilt',
       lead:'The three emotional traps that blow up accounts.',
       body:`<p><b>FOMO</b> (fear of missing out) pushes you to chase a move that already happened, entering late with bad risk. <b>Revenge trading</b> is trying to win back a loss immediately — trading from anger, not analysis. <b>Tilt</b> (borrowed from poker) is the spiral where one bad outcome wrecks your emotional control for the rest of the session.</p>
       <p>All three share a root: <b>emotional urgency overriding process.</b> The market will be open tomorrow. There is always another setup. Urgency is almost always a signal to step away, not lean in.</p>`,
       concept:{t:'Clinical tip',body:'Name the feeling out loud — "this is FOMO," "I am on tilt." Labeling an emotion measurably reduces its grip on your behavior; it re-engages the rational brain.'}
      },
      {type:'lesson', title:'Discipline as a System, Not Willpower',
       lead:'Do not rely on being strong in the moment.',
       body:`<p>Willpower is a finite, depletable resource — and it is weakest exactly when you are tired, stressed, or down money. Relying on "I will just be disciplined" is a plan to fail.</p>

function renderStep(){
  const t=TRACKS[view.track];
  const step=t.steps[view.step];
  const total=t.steps.length;
  const pct=Math.round((view.step)/total*100);
  const dots=t.steps.map((s,i)=>`<div class="d ${i<view.step?'done':i===view.step?'cur':''}"></div>`).join('');

  let inner='';
  if(step.type==='lesson') inner=lessonHTML(t,step);
  else if(step.type==='quiz') inner=quizHTML(t,step);
  else if(step.type==='practice') inner=practiceHTML(t,step);

  app().innerHTML=topbar()+`<div class="wrap fade">
    <div class="lesson-top">
      <button class="btn btn-ghost btn-sm" onclick="goHome()">← Tracks</button>
      <div class="crumbs"><b>${t.name}</b> · ${view.step+1}/${total}</div>
    </div>
    <div class="prog-line"><div style="width:${pct}%"></div></div>
    <div class="step-dots">${dots}</div>
    ${inner}
  </div>`;

  // mount chart if present
  if(step.chart){
    requestAnimationFrame(()=>{
      const cv=document.getElementById('chart');
      if(cv){ view.activeChart=buildChart(cv,step.chart);
        if(step.type==='practice') wireUpPractice(t,step);
        else if(step.interactive) wireUpInteractive(cv,step.interactive);
      }
    });
  }
}

function wireUpInteractive(cv, mode){
  cv.style.cursor='pointer';
  const onTap=(e)=>{
    const ch=view.activeChart; if(!ch) return;
    const r=cv.getBoundingClientRect();
    const px=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const py=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
    const key=ch.hitTest(px,py,mode);
    if(key){ e.preventDefault(); setHighlight(key); }
  };
  cv.addEventListener('click',onTap);
  cv.addEventListener('touchstart',onTap,{passive:false});
}

// set/toggle the highlighted part and sync the matching chip
function setHighlight(key){
  const ch=view.activeChart; if(!ch) return;
  const wasActive = ch.highlight===key;
  ch.highlight = wasActive ? null : key;
  ch.draw();
  document.querySelectorAll('.term-btn').forEach(b=>{
    b.classList.toggle('active', !wasActive && b.dataset.anat===key);
  });
}

function lessonHTML(t,step){
  let terms='';
  const keyMap={anatomy:['body','wick','green','red'],wicks:['upper','lower'],structure:['HH','HL','LH','LL']};
  if(step.terms && keyMap[step.interactive]){
    const keys=keyMap[step.interactive];
    terms=`<div class="term-row">${step.terms.map(([a,b],i)=>`<button class="term term-btn" data-anat="${keys[i]}" onclick="anatomyClick('${keys[i]}',this)"><b>${a}</b> — ${b}</button>`).join('')}</div><div class="anatomy-hint">👆 Tap each part to light it up on the chart below</div>`;
  } else if(step.terms){
    terms=`<div class="term-row">${step.terms.map(([a,b])=>`<div class="term"><b>${a}</b> — ${b}</div>`).join('')}</div>`;
  }
  const after=step.afterTerms||'';
  const concept=step.concept?`<div class="concept ${step.concept.warn?'warn':''}"><div class="ct">${step.concept.t}</div>${step.concept.body}</div>`:'';
  const chart=step.chart?`<div class="chart-shell"><canvas id="chart"></canvas></div>${step.cap?`<div class="chart-cap">${step.cap}</div>`:''}`:'';
  return `<div class="card">
    <h2>${step.title}</h2>
    <div class="lead">${step.lead||''}</div>
    ${step.body||''}
    ${terms}${after}
    ${chart}
    ${concept}
    <div class="nav-row">
      ${view.step>0?`<button class="btn btn-ghost btn-block" onclick="prevStep()">← Back</button>`:''}
      <button class="btn btn-primary btn-block" onclick="nextStep()">Continue →</button>
    </div>
  </div>`;
}

function anatomyClick(key, btn){ setHighlight(key); }

function quizHTML(t,step){
  const opts=step.opts.map((o,i)=>{
    let cls='';

function wireUpPractice(t,step){
  const ch=view.activeChart;
  const cv=document.getElementById('chart');
  if(!cv||!ch) return;
  view.tool = step.tool==='hline'?'support'
            : step.tool==='tline'?'trend'
            : step.tool==='marks'?'HH'
            : step.tool==='icc'?'grab'
            : step.tool==='level'?'level'
            : step.tool==='pointmark'?'point':null;
  view.trendPts=[];
  // re-render toolbar active state
  let dragging=false;

  function pos(e){
    const r=cv.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
    return {x:cx,y:cy};
  }
  function handle(e){
    e.preventDefault();
    const {x,y}=pos(e);
    if(view.tool==='support'){
      ch.userLines=[{type:'h',price:ch.priceAt(y),color:'#26A69A'}];
    } else if(view.tool==='trend'){
      view.trendPts.push({x,y});
      if(view.trendPts.length>2) view.trendPts=[{x,y}];
      if(view.trendPts.length===2){
        ch.userLines=[{type:'t',x1:view.trendPts[0].x,y1:view.trendPts[0].y,x2:view.trendPts[1].x,y2:view.trendPts[1].y,color:'#F5B82E'}];
      } else {
        ch.userMarks=[{x,y,color:'#F5B82E',label:''}];
      }
    } else if(view.tool==='HH'||view.tool==='HL'){
      // remove existing of same label then add
      ch.userMarks=ch.userMarks.filter(m=>m.label!==view.tool);
      ch.userMarks.push({x,y,color:view.tool==='HH'?'#26A69A':'#5B8DEF',label:view.tool,up:view.tool==='HH'});
    } else if(view.tool==='grab'||view.tool==='zone'){
      ch.userMarks=ch.userMarks.filter(m=>m.kind!==view.tool);
      ch.userMarks.push({x,y,color:view.tool==='grab'?'#EF5350':'#9B7BF0',label:view.tool,kind:view.tool,up:view.tool==='grab'});
      if(view.tool==='zone'){ ch.userLines=ch.userLines.filter(l=>l.kind!=='zone'); ch.userLines.push({type:'h',price:ch.priceAt(y),color:'#9B7BF0',kind:'zone'}); }
    } else if(view.tool==='level'){
      ch.userLines=[{type:'h',price:ch.priceAt(y),color:step.toolColor||'#5B8DEF'}];
    } else if(view.tool==='point'){
      ch.userMarks=[{x,y,color:step.toolColor||'#9B7BF0',label:step.toolLabel||'',up:true}];
    }
    ch.draw();
  }
  const drag=()=>view.tool==='support'||view.tool==='level';
  cv.onmousedown=e=>{dragging=true;handle(e);};
  cv.onmousemove=e=>{if(dragging&&drag())handle(e);};
  cv.onmouseup=()=>dragging=false;
  cv.ontouchstart=handle;
  cv.ontouchmove=e=>{if(drag())handle(e);};
}

function setTool(tool){ view.tool=tool;
  // update active classes without full redraw
  document.querySelectorAll('.tool').forEach(el=>el.classList.remove('active'));
  event.currentTarget.classList.add('active');
}
function clearDrawings(){
  const ch=view.activeChart; if(!ch)return;
  ch.userLines=[]; ch.userMarks=[]; view.trendPts=[]; ch.draw();
  const fb=document.getElementById('fb'); if(fb){fb.className='feedback-banner';fb.innerHTML='';}
}

function checkPractice(){
  const t=TRACKS[view.track], step=t.steps[view.step], ch=view.activeChart;
  const fb=document.getElementById('fb');
  let ok=false, msg='';
  const tol=(ch.max-ch.min)*0.06; // price tolerance

  if(step.checkType==='supportLevel'){
    const line=ch.userLines.find(l=>l.type==='h');
    if(!line){ msg='Draw a support line first — select the Support tool and click on the chart.'; }
    else if(Math.abs(line.price-ch.answerPrice)<=tol*1.4){ ok=true; msg='Nailed it. That\'s the level where buyers keep defending — every dip into it bounced.'; }
    else { msg=`Close, but not quite at the support. Look lower — find where the candle lows line up (around ${ch.answerPrice.toFixed(0)}).`; }
  }
  else if(step.checkType==='uptrendLine'){
    const line=ch.userLines.find(l=>l.type==='t');
    if(!line){ msg='Draw a trendline — click the first swing low, then a later swing low.'; }
    else {
      const slopeUp=(line.y2-line.y1)/(line.x2-line.x1) < -0.05; // y inverted: up = negative slope
      if(slopeUp){ ok=true; msg='Good. Your line rises under the swing lows — as long as price holds above it, the uptrend is intact.'; }
      else { msg='Your line should rise to the right (connect a low to a HIGHER later low). Try again.'; }
    }
  }
  else if(step.checkType==='structureLabels'){
    const hh=ch.userMarks.find(m=>m.label==='HH');
    const hl=ch.userMarks.find(m=>m.label==='HL');
    if(!hh||!hl){ msg='Place at least one HH and one HL marker on the chart.'; }
    else {
      const hhOK=ch.answerPivots.some(p=>p.label==='HH'&&Math.abs(ch.xOf(p.i)-hh.x)<ch.cw*3 && hh.y<ch.plotH*0.6+ch.plotT+40);
      const hlOK=ch.answerPivots.some(p=>p.label==='HL'&&Math.abs(ch.xOf(p.i)-hl.x)<ch.cw*3);
      if(hh.y<hl.y){ ok=true; msg='Right structure. The peaks are your higher highs, the valleys your higher lows — textbook uptrend.'; }
      else { msg='Check placement: HH belongs on a peak (higher up), HL on a valley (lower down). Your HH should sit above your HL.'; }
    }
  }
  else if(step.checkType==='iccSetup'){
    const grab=ch.userMarks.find(m=>m.kind==='grab');
    const zone=ch.userMarks.find(m=>m.kind==='zone');
    if(!grab||!zone){ msg='Mark both: the Grab (the sweep wick low) and the Zone (base of the displacement candle).'; }
    else {
      const grabX=ch.xOf(ch.answerGrab.i);
      const grabOK=Math.abs(grab.x-grabX)<ch.cw*3 && ch.priceAt(grab.y)<ch.answerGrab.price+tol*2;
      const zoneOK=zone.x>grabX; // zone after the grab
      if(grabOK&&zoneOK){ ok=true; msg='That\'s the setup: liquidity swept below support (the grab), then displacement up. The zone is your entry on a pullback, stop below the grab.'; }
      else if(!grabOK){ msg='The grab is the lowest wick that pierces support then snaps back — look for the deepest spike.'; }
      else { msg='The zone should come AFTER the grab — it\'s the base of the big candle that displaced upward.'; }
    }
  }
  else if(step.checkType==='levelNear'){
    const line=ch.userLines.find(l=>l.type==='h');
    if(!line){ msg=step.noDrawMsg||'Select the tool, then click on the chart to mark the level.'; }
    else if(Math.abs(line.price-ch.answerPrice)<=tol*1.6){ ok=true; msg=step.okMsg||'Correct!'; }
    else { msg=step.failMsg||'Not quite — look again at where the level sits.'; }
  }
  else if(step.checkType==='levelBelow'){
    const line=ch.userLines.find(l=>l.type==='h');
    const band=(ch.max-ch.min)*0.22;
    if(!line){ msg=step.noDrawMsg||'Place your stop line on the chart.'; }
    else if(line.price<ch.answerPrice && line.price>ch.answerPrice-band){ ok=true; msg=step.okMsg||'Good stop placement.'; }
    else if(line.price>=ch.answerPrice){ msg=step.failMsg||'Your stop is too high — it should sit just BELOW the swing low.'; }
    else { msg='That stop is very far away — tighten it to just below the structure for better risk:reward.'; }
  }
  else if(step.checkType==='markCandle'){
    const m=ch.userMarks[ch.userMarks.length-1];
    if(!m){ msg=step.noDrawMsg||'Click directly on the candle.'; }
    else if(Math.abs(m.x-ch.xOf(ch.answerIndex))<ch.cw*2.2){ ok=true; msg=step.okMsg||'That\'s the one!'; }
    else { msg=step.failMsg||'Not that candle — look again.'; }
  }

  if(fb){ fb.className='feedback-banner show '+(ok?'ok':'no'); fb.innerHTML=(ok?'✓ ':'')+msg; }
  if(ok){
    view.practiceDone=true;
    document.getElementById('checkBtn').style.display='none';
    document.getElementById('contBtn').style.display='inline-flex';
    bumpXP(10);
  }
}

/* ════════════════════════════════════════════════════
   NAV / FLOW
════════════════════════════════════════════════════ */
function goHome(){ view.screen='home'; render(); window.scrollTo(0,0); }
function openTrack(ti){
  view.track=ti;
  view.step=S.progress[TRACKS[ti].id]&&!S.completed[TRACKS[ti].id]?S.progress[TRACKS[ti].id]:0;
  if(S.completed[TRACKS[ti].id]) view.step=0;
  resetStepFlags();
  view.screen='step'; render(); window.scrollTo(0,0);
}
function resetStepFlags(){ view.answered=false; view.sel=null; view.practiceDone=false; view.tool=null; view.trendPts=[]; }
function pickOpt(i){
  const t=TRACKS[view.track], step=t.steps[view.step];
  view.sel=i; view.answered=true;
  if(i===step.answer) bumpXP(10);
  renderStep(); window.scrollTo(0,0);
}
function nextStep(){
  const t=TRACKS[view.track];
  // record progress
  const reached=Math.max(S.progress[t.id]||0, view.step+1);
  S.progress[t.id]=Math.min(reached,t.steps.length); persist();
  if(view.step+1>=t.steps.length){
    if(!S.completed[t.id]){ S.completed[t.id]=true; bumpXP(t.steps.length*15); }
    S.completed[t.id]=true; persist();
    view.screen='complete'; render(); window.scrollTo(0,0); return;
  }
  view.step++; resetStepFlags(); renderStep(); window.scrollTo(0,0);
}
function prevStep(){ if(view.step>0){view.step--;resetStepFlags();renderStep();window.scrollTo(0,0);} }
function bumpXP(n){ S.xp+=n; persist();
  document.querySelectorAll('.xp-pill').forEach(e=>e.innerHTML='⚡ '+S.xp+' XP');
}

/* ════════════════════════════════════════════════════
   CONFETTI
════════════════════════════════════════════════════ */
const conf=document.getElementById('confetti'), cctx=conf.getContext('2d');
let cps=[],cactive=false;
function sizeConf(){conf.width=innerWidth;conf.height=innerHeight;}
sizeConf();addEventListener('resize',()=>{sizeConf();});
function fireConfetti(){
  cactive=true;cps=[];
  const cols=['#26A69A','#5B8DEF','#F5B82E','#9B7BF0','#EF5350','#fff'];
  for(let i=0;i<120;i++)cps.push({x:Math.random()*conf.width,y:-20,vx:(Math.random()-.5)*6,vy:Math.random()*4+2,col:cols[~~(Math.random()*cols.length)],sz:Math.random()*8+4,rot:Math.random()*6,rs:(Math.random()-.5)*.3});
  loopConf();setTimeout(()=>cactive=false,4000);
}
function loopConf(){
  if(!cactive){cctx.clearRect(0,0,conf.width,conf.height);return;}
  cctx.clearRect(0,0,conf.width,conf.height);
  cps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.rot+=p.rs;
    cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.rot);cctx.fillStyle=p.col;cctx.globalAlpha=Math.max(0,1-p.y/conf.height);
    cctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);cctx.restore();});
  cps=cps.filter(p=>p.y<conf.height+40);
  requestAnimationFrame(loopConf);
}

/* boot */
render();
</script>
